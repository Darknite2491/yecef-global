<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0C0B" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png" />

    <title>YECEF Global — We bring the bus to your junction</title>
    <meta name="description" content="Youths Emerge for Christ Empowerment Foundation runs one free youth conference a year in Lagos, with free buses from 13 pickup points across Lagos and Ogun. Fresh Fire 2026 — Saturday 12 September, Trinity House, Oniru." />

    <!-- Open Graph: this is what shows in a WhatsApp forward, the site's real distribution channel -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YECEF Global" />
    <meta property="og:title" content="Fresh Fire 2026 — Saturday 12 September, Trinity House Oniru" />
    <meta property="og:description" content="Free entry. Free buses from 13 pickup points across Lagos and Ogun. Doors 8:30am, we start 9:00 prompt." />
    <!-- Absolute URL: WhatsApp and most scrapers ignore relative og:image paths.
         Change this if the site moves to a custom domain. -->
    <meta property="og:url" content="https://yecef.netlify.app/" />
    <link rel="canonical" href="https://yecef.netlify.app/" />
    <meta property="og:image" content="https://yecef.netlify.app/images/og-fresh-fire.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

    <!-- Event schema so Google shows the date, venue and price in search results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Fresh Fire 2026 — Youth Explosion for Christ",
      "startDate": "2026-09-12T09:00:00+01:00",
      "endDate": "2026-09-12T15:00:00+01:00",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": "Trinity House, Zion Centre",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Trinity Avenue, along Coastal Road by Rainoil filling station, Oniru",
          "addressLocality": "Victoria Island, Eti-Osa",
          "addressRegion": "Lagos",
          "postalCode": "106104",
          "addressCountry": "NG"
        }
      },
      "organizer": {
        "@type": "Organization",
        "name": "Youths Emerge for Christ Empowerment Foundation",
        "alternateName": "YECEF Global"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "NGN",
        "availability": "https://schema.org/InStock",
        "url": "https://forms.gle/P5H6K5Qinzy9ij5GA"
      },
      "isAccessibleForFree": true
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
