[build]
  command = "npm run build"
  publish = "dist"

# Netlify defaults new projects to Node 24, and `npm ci` fails there during
# dependency installation for this dependency set. Vite 5 targets Node 18/20/22,
# and 22 is what the committed lockfile was generated with — pinning it makes
# the CI build match a known-good local install.
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Short link for bulk SMS / print / flyers: /join -> WhatsApp group invite.
# Carrier and bulk-SMS spam filters score raw chat.whatsapp.com links hard, so
# messages point at our own domain and land here instead. force = true so this
# wins over the SPA catch-all below.
# To change which group /join opens, edit the `to =` value -- nothing else
# in the codebase references it.
[[redirects]]
  from = "/join"
  to = "https://chat.whatsapp.com/KjRTIFVRF4443pD4p1Q2cI"
  status = 302
  force = true

[[redirects]]
  from = "/join/"
  to = "https://chat.whatsapp.com/KjRTIFVRF4443pD4p1Q2cI"
  status = 302
  force = true

# Only needed if you switch main.jsx from HashRouter to BrowserRouter.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
